# Publishes n8n-nodes-echothread to npm with provenance when a tag
# n8n-vX.Y.Z is pushed. Secrets: NPM_TOKEN until trusted publishing is set up.
name: Release n8n node
on:
  push:
    tags: ['n8n-v*']
permissions:
  contents: read
  id-token: write
concurrency: release-n8n
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-nodes-echothread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
        working-directory: .
      - name: Tag matches the package version
        run: |
          v="${GITHUB_REF_NAME#n8n-v}"
          got="$(node -p "require('./package.json').version")"
          [ "$got" = "$v" ] || { echo "::error::version $got does not match tag $v"; exit 1; }
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
